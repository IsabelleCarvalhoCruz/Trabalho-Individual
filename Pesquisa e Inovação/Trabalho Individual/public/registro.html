<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/registro.css">
     <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <title>Faça seu cadastro!</title>
</head>
<body>

    <div class="container-registro">

         <div class="imagem">
        <img src="./imagens/ballet3.jpg">
        </div>

        <div class="registro">
            <div class="cadastro"> 
                   <a href="login.html">⬅ Voltar</a>
                <h1>Faça seu cadastro!</h1>
                <h2>Seja um membro da comunidade Fonteyn!</h2>
            </div>

            <div class="reg">
                <h1>Cadastro</h1>
                <h2>Nome:</h2>
                <input type="text" class="nome" id="ipt_nome" placeholder="Nome">
                <h2>Senha:</h2>
                <input type="password" class="senha" id="ipt_senha" placeholder="Senha">
                <h2>Email:</h2>
                <input type="text" class="email" id="ipt_email" placeholder="Email">
                <button onclick="cadastrar()"><a href="#">Cadastrar</a></button>
            </div>

        </div>
    </div>
   
</body>
</html>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js">

</script>

<script>

  function cadastrar() {
    var nomeVar = ipt_nome.value;
    var emailVar = ipt_email.value;
    var senhaVar = ipt_senha.value;

    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" 
    ) {
            Toastify({
            text: "Preencha todos os campos para prosseguir!",
            duration: 3000,
            style: {
            background: "linear-gradient(to right, #FF8C00, #FF4500)",
                },
            }).showToast();
    }  else if(emailVar != (emailVar.includes('@')) && emailVar != (emailVar.includes('.'))){
             Toastify({
            text: "Por-favor adicionar um endereço de email válido!",
            duration: 3000,
            style: {
            background: "linear-gradient(to right, #FF8C00, #FF4500)",
                    },
             }).showToast();
        } else if(senhaVar <= 7){
               Toastify({
            text: "Por-favor adicionar uma senha entre 7 e 9 caracteres!",
            duration: 3000,
            style: {
            background: "linear-gradient(to right, #FF8C00, #FF4500)",
                    },
             }).showToast();
        } else if (emailVar != (emailVar.includes('@')) && emailVar != (emailVar.includes('$')) 
        && emailVar != (emailVar.includes('!')) && emailVar != (emailVar.includes('#'))){
                Toastify({
            text: "Por-favor adicionar uma senha com caracteres especiais (@ ou $ ou ! ou #)",
            duration: 3000,
            style: {
            background: "linear-gradient(to right, #FF8C00, #FF4500)",
                    },
             }).showToast();
        } else {
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({

        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {

           Toastify({
                text: "Cadastro realizado com sucesso! Redirecionando para tela de Login...",
                duration: 3000,
                style: {
                background: "linear-gradient(to right, #67CB57, #90EE90)",
        },
      }).showToast();

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");
          
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";


        console.log("Houve um erro ao tentar realizar o cadastro!");

                 Toastify({
                text: "Houve um erro ao tentar realizar o cadastro!",
                duration: 3000,
                style: {
                background: "linear-gradient(to right, #FF8C00, #FF4500)",
        },
      }).showToast();
             
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
   return false;
        }


  }
  
</script>
