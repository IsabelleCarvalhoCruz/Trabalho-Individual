<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <title>Faça seu login!</title>
</head>
<body>

<div class="container-login">

    <div class="imagem">
    <img src="./imagens/ballet3.jpg">
    </div>

    <div class="login">
        <div class="bemvindo"> 
            <a href="index.html"> ⬅ Voltar</a>
            <h1>Bem-vindo de volta!</h1>
            <h2>Faça login para ter acesso a funcionalidades exclusivas</h2>
        </div>

        <div class="log">
            <h1>Faça seu login!</h1>
            <h2>Email:</h2>
            <input type="text" class="email" id="ipt_email" placeholder="Email">
            <h2>Senha:</h2>
            <input type="password" class="senha" id="ipt_senha" placeholder="Senha">
            <div class="links">
                <a href="senha.html">Esqueceu a senha?</a>
            </div>
            <button onclick="entrar()" class="botao"><a href="#">Entrar</a></button>
            <a href="registro.html">Não possui cadastro? Clique aqui</a>
        </div>
    </div>
</div>
    
</body>
</html>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js">

</script>

<script>
    function entrar() {

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
             Toastify({
            text: "Preencha todos os campos para prosseguir!",
            duration: 3000,
            style: {
            background: "linear-gradient(to right, #FF8C00, #FF4500)",
                },
            }).showToast();
        }
        else if(emailVar =!(emailVar.includes('@')) && (emailVar =!(emailVar.includes('.')))){
             Toastify({
            text: "Por-favor adicionar um endereço de email válido!",
            duration: 3000,
            style: {
            background: "linear-gradient(to right, #FF8C00, #FF4500)",
                    },
             }).showToast();
        } else if(senhaVar <= 7){
               Toastify({
            text: "Por-favor adicionar uma senha válida!",
            duration: 3000,
            style: {
            background: "linear-gradient(to right, #FF8C00, #FF4500)",
                    },
             }).showToast();
        } else if (senhaVar =!(senhaVar.includes('@')) && (senhaVar =!(senhaVar.includes('$'))) 
        && (senhaVar =!(senhaVar.includes('!'))) && (senhaVar =!(senhaVar.includes('#')))){
                Toastify({
            text: "Por-favor adicionar uma senha válida!",
            duration: 3000,
            style: {
            background: "linear-gradient(to right, #FF8C00, #FF4500)",
                    },
             }).showToast();
        } else {
 console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.SENHA_USUARIO = json.senha;
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                     Toastify({
                    text: "Credenciais verificadas! Direcionando para a outra página...",
                    duration: 3000,
                    style: {
                    background: "linear-gradient(to right, #67CB57, #90EE90)",
                         },
                     }).showToast();


                var intervalo = setInterval(()=>{
                    window.location.href = "dashboard.html";
                },3000); 
                   

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                 Toastify({
                text: "Houve um erro ao tentar realizar o login!",
                duration: 3000,
                style: {
                background: "linear-gradient(to right, #FF8C00, #FF4500)",
        },
      }).showToast();

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
        }

       
    }

</script>
