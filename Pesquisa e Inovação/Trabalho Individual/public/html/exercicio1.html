<body onload="onloadEsconder()">
      <div id="pontuacaoEJogo">

             <h1>Iniciar quizz?</h1>

<script>

    const questions = [
    {
        question: "Qual é o nome da técnica de ballet criada na Italia?",
        answers: [
            {id: 1, text:"Balanchine", correct:false},
            {id: 2, text:"Cecchetti", correct:true},
            {id: 3, text:"Vaganova", correct:false},
            {id: 4, text:"Royal", correct:false}
        ]
    },

     {
        question: "Em que ano a Bolshoi estreou sua primeira sede no Brasil?",
        answers: [
            {id: 1, text:"2000", correct:true},
            {id: 2, text:"1990", correct:false},
            {id: 3, text:"2003", correct:false},
            {id: 4, text:"1997", correct:false}
        ]
    },

     {
        question: "Em que século o Ballet foi criado?",
        answers: [
            {id: 1, text:"Século 17", correct:false},
            {id: 2, text:"Século 18", correct:false},
            {id: 3, text:"Século 15", correct:true},
            {id: 4, text:"Século 16", correct:false}
        ]
    },

     {
        question: "Qual o nome da técnica de ballet criada na Rússia?",
        answers: [
            {id: 1, text:"Vaganova", correct:true},
            {id: 2, text:"Royal", correct:false},
            {id: 3, text:"Cubano", correct:false},
            {id: 4, text:"Cecchetti", correct:false}
        ]
    },

     {
        question: "Qual foi o  primeiro espectacúlo de ballet criado?",
        answers: [
            {id: 1, text:"O Corsário", correct:false},
            {id: 2, text:"O Balé Cômico da Rainha", correct:true},
            {id: 3, text:"Giselle", correct:false},
            {id: 4, text:"La Sylphide", correct:false}
        ]
    },

     {
        question: "Qual foi a primeira escola de ballet inaugurada na Rússia?",
        answers: [
            {id: 1, text:"Bolshoi", correct:false},
            {id: 2, text:"Vaganova", correct:false},
            {id: 3, text:"Escola Imperial de Balé de São Petersburgo", correct:true},
            {id: 4, text:"Mariinsky", correct:false}
        ]
    },

     {
        question: "Quem é o criador da técnica de ballet conhecida como Vaganova?",
        answers: [
            {id: 1, text:"Agrippina Vaganova", correct:true},
            {id: 2, text:"Marius Petipa", correct:false},
            {id: 3, text:"Enrico Cecchetti", correct:false},
            {id: 4, text:"Natalia Osipova", correct:false}
        ]
    },

     {
        question: "Quando foi criada a primeira sapatilha de ponta?",
        answers: [
            {id: 1, text:"Século 20", correct:false},
            {id: 2, text:"Século 19", correct:true},
            {id: 3, text:"Século 18", correct:false},
            {id: 4, text:"Século 21", correct:false}
        ]
    },

     {
        question: "Qual foi o primeiro espetáculo conhecido por utilizar sapatilha de ponta?",
        answers: [
            {id: 1, text:"La Sylphide", correct:true},
            {id: 2, text:"Giselle", correct:false},
            {id: 3, text:"O Lago dos Cisnes", correct:false},
            {id: 4, text:"O Quebra-Nozes", correct:false}
        ]
    },

     {
        question: "Qual é o nome do criador das primeiras 5 posições do ballet?",
        answers: [
            {id: 1, text:"Jean-Georges Noverre:", correct:false},
            {id: 2, text:"Marius Petipa", correct:false},
            {id: 3, text:"Pierre Beauchamp", correct:true},
            {id: 4, text:"Agrippina Vaganova", correct:false}
        ]
    }
    
];

const questionElement = document.getElementById('question');
const answerButtons = document.getElementById('answer-buttons');
const nextButton = document.getElementById('next-btn');

let currentQuestionIndex = 0;
let acertos = 0;
let erros = 0;

function onloadEsconder() {
    document.getElementById('pontuacao').style.display = "none";
}

function iniciarQuiz(){
    document.getElementById('pontuacao').style.display = "block";
    document.getElementById('btnIniciarQuiz').style.display = "none";
    document.getElementById('pontuacaoEJogo').style.display = "none";
}


function startQuiz(){
    currentQuestionIndex = 0;
    acertos = 0;
    erros = 0;

    nextButton.innerHTML = "Próxima";
    showQuestion();
}

function resetState(){
    nextButton.style.display = "none";

    while(answerButtons.firstChild){
        answerButtons.removeChild(answerButtons.firstChild);
    }
}

function showQuestion(){
    resetState();
    let currentQuestion = questions[currentQuestionIndex];
    let questionNo = currentQuestionIndex + 1;
    questionElement.innerHTML = questionNo + ". " + currentQuestion.question;

    for (let i = 0; i <currentQuestion.answers.length; i++){
        let answer = currentQuestion.answers[i];


        const button = document.createElement('button');
        button.innerHTML = answer.text;
        button.dataset.id = answer.id;
        button.addEventListener('click', selectAnswer);
        button.classList.add('btn');
        answerButtons.appendChild(button);
    }
    
}

function selectAnswer(e){
    answers = questions[currentQuestionIndex].answers;
    const correctAnswer = answers.filter((answer) => answer.correct == true)[0]

    const selectedBtn = e.target;
    const isCorrect = selectedBtn.dataset.id == correctAnswer.id;

    if(isCorrect){
        selectedBtn.classList.add("correct")
        acertos++;
    } else{
        selectedBtn.classList.add("incorrect")
        erros++;
    }

    let nota = acertos * 10;

    Array.from(answerButtons.children).forEach((button) => {
        button.disabled = true;
    });
    nextButton.style.display = "block";
}

function showScore(){
    resetState();
    questionElement.innerHTML = `Você acertou ${acertos} e errou ${erros} de ${questions.length}!`
    nextButton.innerHTML = "Jogar de novo"
    nextButton.style.display = "block"
}

function handleNextButtton(){
    currentQuestionIndex++;

    if(currentQuestionIndex < questions.length){
        showQuestion();
    } else{
        showScore();
    }
}

nextButton.addEventListener("click", () =>{
    if(currentQuestionIndex < questions.length){
        handleNextButtton();
    } else{
         fetch(`/quizz/inserirPontuação`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                acertosServer: acertos,
                errosServer: erros,
                notaServer: nota 
            })
        })
        .then(function(response){
        return response.json();
        })
        .catch(function(err){
        console.log(err);
        })
        .then(startQuiz());
    }
})

startQuiz();


</script>
